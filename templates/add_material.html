<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter matériel - COLAIMO</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="add-material-page">

    <div class="add-material-header">
        <div>
            <h1>Ajouter matériel</h1>
            <p>Ajouter un nouveau matériel dans l'inventaire COLAIMO.</p>
        </div>

        <a href="{{ url_for('materials') }}" class="back-btn">
            Retour aux matériels
        </a>
    </div>


    <div class="add-material-card">

        <h2>Informations du matériel</h2>

        <form method="POST" action="{{ url_for('add_material') }}">

            <div class="form-grid">

                <div class="form-field">
                    <label for="type">Type de matériel</label>

                    <select id="type" name="type" required>
                        <option value="">-- Sélectionner --</option>
                        <option value="Ordinateur">Ordinateur</option>
                        <option value="Écran">Écran</option>
                        <option value="Clavier">Clavier</option>
                        <option value="Imprimante">Imprimante</option>
                        <option value="Souris">Souris</option>
                        <option value="Projecteur">Projecteur</option>
                        <option value="Unité centrale">Unité centrale</option>
                        <option value="Routeur">Routeur</option>
                        <option value="Autre">Autre</option>
                    </select>
                </div>


                <div class="form-field">
                    <label for="reference">Référence</label>

                    <input
                        type="text"
                        id="reference"
                        name="reference"
                        required>
                </div>


                <div class="form-field">
                    <label for="marque">Marque</label>

                    <input
                        type="text"
                        id="marque"
                        name="marque"
                        required>
                </div>


                <div class="form-field">
                    <label for="date_achat">Date d'achat</label>

                    <input
                        type="date"
                        id="date_achat"
                        name="date_achat"
                        required>
                </div>


                <div class="form-field">
                    <label for="quantite">Quantité</label>

                    <input
                        type="number"
                        id="quantite"
                        name="quantite"
                        min="1"
                        required>
                </div>

            </div>


            <div class="form-actions">

                <a href="{{ url_for('materials') }}" class="cancel-btn">
                    Annuler
                </a>

                <button type="submit" class="save-btn">
                    Ajouter matériel
                </button>

            </div>

        </form>

    </div>

</div>

</body>
</html>
