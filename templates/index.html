<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Matériels</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<form class="card" method="POST" action="/add">

    <h1>Gestion des Matériels</h1>

    <div class="field">
        <label for="type">Type de produit</label>
        <select id="type" name="type" required>
            <option value="">-- Choisir un produit --</option>
            <option value="Unité centrale">Unité centrale</option>
            <option value="Écran">Écran</option>
            <option value="Clavier">Clavier</option>
            <option value="Souris">Souris</option>
            <option value="Imprimante">Imprimante</option>
        </select>
    </div>

    <div class="field">
        <label for="reference">Référence</label>
        <input
            type="text"
            id="reference"
            name="reference"
            placeholder="Ex: MSI-001"
            required>
    </div>

    <div class="field">
        <label for="marque">Marque</label>
        <input
            type="text"
            id="marque"
            name="marque"
            placeholder="Ex: MSI"
            required>
    </div>

    <div class="field">
        <label for="date">Date d'achat</label>
        <input
            type="date"
            id="date"
            name="date"
            required>
    </div>

    <div class="field">
        <label for="quantite">Quantité</label>
        <input
            type="number"
            id="quantite"
            name="quantite"
            min="1"
            placeholder="0"
            required>
    </div>

    <button type="submit" class="submit-btn">
        Ajouter
    </button>

</form>

</body>
</html>
