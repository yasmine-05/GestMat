<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ajouter utilisateur - COLAIMO</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="add-material-page">

    <div class="add-material-header">

        <div>
            <h1>Ajouter utilisateur</h1>

            <p>
                Créer un nouveau compte utilisateur pour COLAIMO.
            </p>
        </div>

        <a href="{{ url_for('users') }}" class="back-btn">
            Retour aux utilisateurs
        </a>

    </div>


    <div class="add-material-card">

        <h2>Informations du compte</h2>

        <form method="POST"
              action="{{ url_for('add_user') }}">

            <div class="form-grid">

                <div class="form-field">

                    <label for="username">
                        Nom d'utilisateur
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Ex : utilisateur01"
                        required>

                </div>


                <div class="form-field">

                    <label for="password">
                        Mot de passe
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Entrer un mot de passe"
                        required>

                </div>

            </div>


            <div class="form-actions">

                <a href="{{ url_for('users') }}"
                   class="cancel-btn">
                    Annuler
                </a>

                <button type="submit"
                        class="save-btn">
                    Ajouter utilisateur
                </button>

            </div>

        </form>

    </div>

</div>

</body>
</html>
